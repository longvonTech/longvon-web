name: CI

# Lint + Build + Test；main 分支 push 通过后由 deploy.yml 部署到 ECS production。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mateyou
          POSTGRES_PASSWORD: mateyou_dev_password
          POSTGRES_DB: mateyou
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgresql://mateyou:mateyou_dev_password@localhost:5432/mateyou?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-placeholder-secret
      JWT_REFRESH_SECRET: ci-only-placeholder-secret-2
      # Required at Next.js build time after Task #15 (prod rejects missing/localhost SITE_URL).
      NEXT_PUBLIC_SITE_URL: https://www.longvon.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for hard-coded credentials
        run: node scripts/check-hardcoded-secrets.mjs

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
