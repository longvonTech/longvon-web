name: Rollback healthy Web release

on:
  workflow_dispatch:
    inputs:
      healthy_release_id:
        description: Reviewed healthy release ID
        type: string
        required: true
      approval:
        description: Approved change record ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollback:
    if: github.repository == 'longvonTech/longvon-web' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute reviewed Web operation
        env:
          OPERATION: rollback
          APPROVAL: ${{ inputs.approval }}
          REVIEWED_APPROVAL: ${{ vars.LONGVON_WEB_ROLLBACK_APPROVAL }}
          HANDOFF_READY: ${{ vars.LONGVON_WEB_HANDOFF_READY }}
          EXPECTED_BUILD: ${{ vars.LONGVON_WEB_EXPECTED_ACTIVE_BUILD }}
          HEALTHY_RELEASES: ${{ vars.LONGVON_WEB_HEALTHY_RELEASES }}
          ECS_SSH_KEY_B64: ${{ secrets.ECS_SSH_KEY_B64 }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          REVIEWED_TARGET: ${{ vars.LONGVON_WEB_ROLLBACK_TARGET }}
          ROLLBACK_ID: ${{ inputs.healthy_release_id }}
        run: bash scripts/recovery/cloud-web.sh
