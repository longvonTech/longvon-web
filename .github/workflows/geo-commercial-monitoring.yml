name: GEO commercial monitoring contracts
on:
  pull_request:
    paths:
      - 'docs/geo/geo-43-003/**'
      - 'scripts/geo/monitoring/**'
      - '.github/workflows/geo-commercial-monitoring.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observation safety and integrity tests (synthetic only)
        run: python3 -W error::ResourceWarning -m unittest discover -s scripts/geo/monitoring -p 'test_*.py' -v
      - name: Bounded browser completion contract tests
        run: node --test scripts/geo/monitoring/browser-capture.test.mjs
