name: Production readonly diagnostics

# LONGVON-PROD-RECOVERY-002 (security-hardened)
# Manual-only ECS readonly diagnostics (O-1 backup + O-3 migration inventory).
# Does NOT call deploy.yml or scripts/deploy.sh.
# Does NOT run migrate resolve/deploy, DDL/DML, mv/rm, PM2 restart, or publish.
#
# Required production environment secrets:
#   ECS_HOST, ECS_USER, ECS_SSH_KEY_B64
#   ECS_SSH_KNOWN_HOSTS  — pre-verified known_hosts line(s) for ECS_HOST
#     (owner-supplied; workflow does NOT trust ssh-keyscan alone)

on:
  workflow_dispatch:
    inputs:
      confirm_readonly:
        description: 'Type YES to confirm readonly diagnostics only (no deploy / no migrate resolve)'
        required: true
        type: string
      approved_sha:
        description: 'Approved 40-char hex content SHA for migration keep-set compare'
        required: true
        type: string
        default: '6762bb656c7d603669ef46a8a8ad6eaf33da439a'

concurrency:
  group: production-readonly-diagnostics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnostics:
    name: ECS readonly O-1 + O-3
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.confirm_readonly == 'YES'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate approved_sha input
        env:
          APPROVED_SHA: ${{ github.event.inputs.approved_sha }}
          CONFIRM_READONLY: ${{ github.event.inputs.confirm_readonly }}
        run: |
          set -euo pipefail
          # Inputs passed only via env — never interpolate untrusted text into shell scripts.
          if [[ "$CONFIRM_READONLY" != "YES" ]]; then
            echo "ERROR: confirm_readonly must be YES"
            exit 1
          fi
          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: approved_sha must be exactly 40 hex characters"
            exit 1
          fi
          if ! git cat-file -e "${APPROVED_SHA}^{commit}"; then
            echo "ERROR: approved_sha is not a reachable git commit in this checkout"
            exit 1
          fi
          echo "approved_sha_ok=${APPROVED_SHA}" >> "$GITHUB_OUTPUT"
        id: validate

      - name: Resolve approved migration keep-set from git SHA
        id: keep
        env:
          APPROVED_SHA: ${{ github.event.inputs.approved_sha }}
        run: |
          set -euo pipefail
          mapfile -t dirs < <(git ls-tree -d --name-only "${APPROVED_SHA}:packages/database/prisma/migrations" | sort)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "ERROR: no migration dirs at approved SHA"
            exit 1
          fi
          # Space-separated keep list for remote env (directory names only; from git tree)
          KEEP="$(printf '%s ' "${dirs[@]}")"
          KEEP="${KEEP% }"
          # GitHub Actions output: avoid multiline; dirs are single tokens
          echo "approved_keep_dirs=${KEEP}" >> "$GITHUB_OUTPUT"
          echo "Approved keep dirs: ${KEEP}"

      - name: Prepare SSH trust from pre-verified known_hosts secret
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY_B64: ${{ secrets.ECS_SSH_KEY_B64 }}
          ECS_SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Do not use set -x
          test -n "${ECS_HOST}"
          test -n "${ECS_USER}"
          test -n "${ECS_SSH_KEY_B64}"
          if [ -z "${ECS_SSH_KNOWN_HOSTS}" ]; then
            echo "ERROR: Secret ECS_SSH_KNOWN_HOSTS is missing."
            echo "Owner must supply pre-verified known_hosts line(s) for ECS_HOST."
            echo "Do not use unverified ssh-keyscan alone."
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/ecs_diag_key"
          echo "$ECS_SSH_KEY_B64" | base64 -d > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" > /dev/null
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          # Write ONLY owner-provided known_hosts (no ssh-keyscan trust bootstrap)
          printf '%s\n' "$ECS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          # Sanity: file non-empty; hashed OpenSSH entries look like |1|...
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ERROR: ECS_SSH_KNOWN_HOSTS produced empty known_hosts"
            exit 1
          fi
          # Host must match ECS_HOST specifically (supports hashed known_hosts entries)
          if ! ssh-keygen -F "$ECS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "ERROR: no known_hosts entry for ECS_HOST (ssh-keygen -F failed)"
            echo "ECS_SSH_KNOWN_HOSTS must contain a verified record for this host."
            exit 1
          fi
          {
            echo "KEY_FILE=$KEY_FILE"
            echo "SSH_OPTS=-i ${KEY_FILE} -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15"
          } >> "$GITHUB_ENV"

      - name: Allocate unique run paths
        id: paths
        run: |
          set -euo pipefail
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REPORT_OUT_DIR="/tmp/prod-db-recovery-002-${RUN_ID}"
          REMOTE_SCRIPT="/tmp/production-readonly-diagnostics-remote-${RUN_ID}.sh"
          {
            echo "RUN_ID=${RUN_ID}"
            echo "REPORT_OUT_DIR=${REPORT_OUT_DIR}"
            echo "REMOTE_SCRIPT=${REMOTE_SCRIPT}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "RUN_ID=${RUN_ID}"
            echo "REPORT_OUT_DIR=${REPORT_OUT_DIR}"
            echo "REMOTE_SCRIPT=${REMOTE_SCRIPT}"
          } >> "$GITHUB_ENV"

      - name: Verify ECS identity (hostname only)
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "${ECS_USER}@${ECS_HOST}" 'hostname; date -u; test -d /root/mateyou && echo MATEYOU_ROOT_OK'

      - name: Stage remote diagnostics script under /tmp (unique per run)
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          REMOTE_SCRIPT: ${{ steps.paths.outputs.REMOTE_SCRIPT }}
        run: |
          set -euo pipefail
          test -n "${REMOTE_SCRIPT}"
          if [[ ! "$REMOTE_SCRIPT" =~ ^/tmp/production-readonly-diagnostics-remote-[A-Za-z0-9._-]+\.sh$ ]]; then
            echo "ERROR: unexpected REMOTE_SCRIPT path"
            exit 1
          fi
          chmod +x scripts/ci/production-readonly-diagnostics-remote.sh
          # shellcheck disable=SC2086
          scp $SSH_OPTS scripts/ci/production-readonly-diagnostics-remote.sh \
            "${ECS_USER}@${ECS_HOST}:${REMOTE_SCRIPT}"
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "${ECS_USER}@${ECS_HOST}" "chmod 700 '${REMOTE_SCRIPT}'"

      - name: Run O-1 backup + O-3 inventory (remote)
        id: remote
        continue-on-error: true
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          APPROVED_KEEP_DIRS: ${{ steps.keep.outputs.approved_keep_dirs }}
          TARGET_MIGRATION: '20261002000000_syndication_jobs'
          RUN_ID: ${{ steps.paths.outputs.RUN_ID }}
          REPORT_OUT_DIR: ${{ steps.paths.outputs.REPORT_OUT_DIR }}
          REMOTE_SCRIPT: ${{ steps.paths.outputs.REMOTE_SCRIPT }}
        run: |
          set -euo pipefail
          test -n "${RUN_ID}"
          test -n "${REPORT_OUT_DIR}"
          test -n "${REMOTE_SCRIPT}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "REPORT_OUT_DIR=${REPORT_OUT_DIR}" >> "$GITHUB_OUTPUT"
          # Pass keep-set via SSH remote env assignment from Actions env (validated keep dirs from git).
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "${ECS_USER}@${ECS_HOST}" \
            env APPROVED_KEEP_DIRS="$APPROVED_KEEP_DIRS" \
                TARGET_MIGRATION="$TARGET_MIGRATION" \
                RUN_ID="$RUN_ID" \
                REPORT_OUT_DIR="$REPORT_OUT_DIR" \
                "$REMOTE_SCRIPT" \
            | tee "${RUNNER_TEMP}/remote-diagnostics.log" \
            | sed -E 's#postgresql://[^[:space:]]+#postgresql://***REDACTED***#gi'

      - name: Fetch sanitized Markdown report only
        if: always() && steps.paths.outputs.REPORT_OUT_DIR != ''
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          REPORT_OUT_DIR: ${{ steps.paths.outputs.REPORT_OUT_DIR }}
        run: |
          set -euo pipefail
          test -n "${REPORT_OUT_DIR}"
          # Allowlist path: only /tmp/prod-db-recovery-002-<runid>
          if [[ ! "$REPORT_OUT_DIR" =~ ^/tmp/prod-db-recovery-002-[A-Za-z0-9._-]+$ ]]; then
            echo "ERROR: unexpected REPORT_OUT_DIR"
            exit 1
          fi
          mkdir -p diagnostics-out
          # shellcheck disable=SC2086
          scp $SSH_OPTS \
            "${ECS_USER}@${ECS_HOST}:${REPORT_OUT_DIR}/PROD-DB-RECOVERY-002-DIAGNOSTICS-REPORT.md" \
            diagnostics-out/PROD-DB-RECOVERY-002-DIAGNOSTICS-REPORT.md
          # Enforce Artifact allowlist: exactly one markdown file
          mapfile -t files < <(find diagnostics-out -type f | sort)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "ERROR: Artifact staging must contain exactly one file"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          case "${files[0]}" in
            *.md) ;;
            *) echo "ERROR: Artifact file must be Markdown"; exit 1 ;;
          esac
          # Refuse dumps / csv / raw sidecars
          if find diagnostics-out -type f \( -name '*.dump' -o -name '*.csv' -o -name '*_raw*' -o -name '*.sql' \) | grep -q .; then
            echo "ERROR: forbidden artifact content detected"
            exit 1
          fi
          ls -la diagnostics-out

      - name: Upload GitHub Artifact (sanitized Markdown only)
        if: always() && hashFiles('diagnostics-out/PROD-DB-RECOVERY-002-DIAGNOSTICS-REPORT.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: prod-db-recovery-002-diagnostics
          path: diagnostics-out/PROD-DB-RECOVERY-002-DIAGNOSTICS-REPORT.md
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup this-run remote temp script and local key
        if: always()
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          REMOTE_SCRIPT: ${{ steps.paths.outputs.REMOTE_SCRIPT }}
        run: |
          set -euo pipefail
          # Delete only this run's unique remote script path (never a shared name / app tree).
          if [ -n "${REMOTE_SCRIPT:-}" ] \
            && [[ "$REMOTE_SCRIPT" =~ ^/tmp/production-readonly-diagnostics-remote-[A-Za-z0-9._-]+\.sh$ ]]; then
            # shellcheck disable=SC2086
            ssh $SSH_OPTS "${ECS_USER}@${ECS_HOST}" "rm -f -- '${REMOTE_SCRIPT}'" || true
          else
            echo "WARN: skipping remote script cleanup (REMOTE_SCRIPT unset or unexpected)"
          fi
          rm -f "${RUNNER_TEMP}/ecs_diag_key" || true

      - name: Fail job if remote diagnostics reported failure
        if: always()
        run: |
          set -euo pipefail
          # continue-on-error above lets us fetch the report; job must still fail on overall FAILED.
          if [ "${{ steps.remote.outcome }}" != "success" ]; then
            echo "Remote diagnostics step outcome=${{ steps.remote.outcome }} — failing job"
            exit 1
          fi
          echo "Remote diagnostics succeeded"
